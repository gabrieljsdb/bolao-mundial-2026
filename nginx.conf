server {
    listen 80;
    server_name bolao.oab-sc.org.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bolao.oab-sc.org.br;

    ssl_certificate     /etc/nginx/certs/wildcard.oab-sc.org.br.crt;
    ssl_certificate_key /etc/nginx/certs/private/wildcard.oab-sc.org.br.key;
    ssl_trusted_certificate /etc/nginx/certs/wildcard.oab-sc.org.br.ca-bundle.crt;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # API proxy
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Frontend static files (SPA)
    location / {
        root /srv/bolao2026;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}